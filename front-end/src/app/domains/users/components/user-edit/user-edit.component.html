<form class="user-form" [formGroup]="userForm" (ngSubmit)="save()" *ngIf="mode === 'edit'">
    <div class="form-row"> 
        <label for="username">Username</label> 
        <input id="username" formControlName="username" />
    </div>
    <div class="form-row"> 
        <label for="email">Email</label> 
        <input id="email" formControlName="email" type="email" />
    </div>
    <div class="form-row"> 
        <label for="password">Password</label> 
        <input id="password" formControlName="password" type="password" /> 
    </div>
    
    <div class="roles-section">
        <div class="roles-container">
            <div class="roles-column">
                <label for="userRoles">User Roles</label>
                <div class="roles-display">
                    <span class="role-tag" *ngFor="let role of userRoles">
                        {{ role.name }}
                        <button type="button" class="role-remove" (click)="removeRole(role)" title="Remove role">×</button>
                    </span>
                    <span class="roles-empty" *ngIf="userRoles.length === 0">No roles assigned</span>
                </div>
            </div>

            <div class="roles-column">
                <label for="availableRoles">Available Roles</label>
                <select id="availableRoles" [(ngModel)]="selectedAvailableRole" 
                name="availableRoles" class="roles-select" [ngModelOptions]="{standalone: true}">
                    <option [ngValue]="null">-- Select a role --</option>
                    <option *ngFor="let role of availableRoles$ | async" [ngValue]="role">
                        {{ role.name }}
                    </option>
                </select>
                <button type="button" class="btn-role-action btn-add-role" (click)="addRole()" [disabled]="!selectedAvailableRole">
                    + Add Role
                </button>
            </div>
        </div>
    </div>

    <div class="form-actions"> 
        <button type="submit" class="btn-primary">Save</button> 
    </div>
</form>

<div class="user-view" *ngIf="mode === 'view'">
    <div class="view-item">
        <strong>Username:</strong>
        <span>{{ user?.username }}</span>
    </div>
    <div class="view-item">
        <strong>Email:</strong>
        <span>{{ user?.email }}</span>
    </div>
    <div class="view-item">
        <strong>Roles:</strong>
        <div class="role-tags-view">
            <span class="role-tag" *ngFor="let role of user?.roles">{{ role.name }}</span>
            <span class="roles-empty" *ngIf="!user?.roles || user?.roles?.length === 0">No roles assigned</span>
        </div>
    </div>
</div>
