<div class="user-list">
  <table>
    <thead>
      <tr>
        <th>NAme</th>
        <th>Email</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let user of users$ | async">
        <td>{{ user.username }}</td>
        <td>{{ user.email }}</td>
        <td>
          <button class="btn btn-view" (click)="viewUser(user)">View</button>
          <button class="btn btn-edit" (click)="editUser(user)">Edit</button>
          <button class="btn btn-delete" (click)="deleteUser(user)">Delete</button>
        </td>
      </tr>
    </tbody>
  </table>

  <div class="add-user">
    <button class="btn btn-add" (click)="addUser()">Add User</button>
  </div>
</div>
